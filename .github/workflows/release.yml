name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: "${{ github.workflow }}@${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    name: Release
    runs-on: blacksmith-4vcpu-ubuntu-2604
    permissions:
      contents: write # required to create releases
      id-token: write # required to sign releases
      attestations: write # required to attest releases
      artifact-metadata: write # required to upload release artifacts

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4.9.1
        with:
          version: v2.13.0
          args: --verbose --current --strip all
        env:
          # Written outside the checkout: GoReleaser refuses to run on a dirty tree.
          OUTPUT: ${{ runner.temp }}/RELEASE.md

      - name: Strip release notes heading
        run: tail -n +3 "$RUNNER_TEMP/RELEASE.md" > "$RUNNER_TEMP/release-notes.md"

      - name: Release
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - uses: actions/attest@v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
