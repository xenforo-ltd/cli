name: Publish images

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * TUE"

  push:
    branches:
      - "main"
    paths:
      - "internal/docker/embed/Dockerfile"

  pull_request:
    branches:
      - "main"
    paths:
      - "internal/docker/embed/Dockerfile"

concurrency:
  group: "${{ github.workflow }}@${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

permissions: {}

env:
  IMAGE: php-ci
  IMAGE_DESCRIPTION: A PHP runtime for XenForo CI
  IMAGE_TARGET: ci
  IMAGE_PHP_VARIANT: cli
  IMAGE_LATEST_VERSION: 8.5
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: ${{ github.repository_owner }}

jobs:
  publish-images:
    name: Publish images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # required to publish images
    strategy:
      matrix:
        php-version: [ "7.2", "8.0", "8.4", "8.5" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.php-version == env.IMAGE_LATEST_VERSION }}
            type=raw,value=${{ matrix.php-version }}

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: internal/docker/embed
          target: ${{ env.IMAGE_TARGET }}
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            PHP_VARIANT=${{ env.IMAGE_PHP_VARIANT }}
            PHP_BUILD_MYSQL=1
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.php-version }}
          cache-to: type=gha,scope=${{ github.ref_name }}-${{ matrix.php-version
            }},mode=max
          push: ${{ github.event_name != 'pull_request' }}
