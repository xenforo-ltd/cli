name: Publish images

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * TUE"

  push:
    branches:
      - "main"
    paths:
      - "internal/docker/embed/Dockerfile"

  pull_request:
    branches:
      - "main"
    paths:
      - "internal/docker/embed/Dockerfile"

concurrency:
  group: "${{ github.workflow }}@${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

permissions: {}

env:
  IMAGE: php-ci
  IMAGE_DESCRIPTION: A PHP runtime for XenForo CI
  IMAGE_TARGET: ci
  IMAGE_PHP_VARIANT: cli
  IMAGE_LATEST_VERSION: 8.5
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: ${{ github.repository_owner }}

jobs:
  publish-images:
    name: Publish images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # required to publish images
    strategy:
      matrix:
        php-version: [ "7.2", "8.0", "8.4", "8.5" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.php-version == env.IMAGE_LATEST_VERSION }}
            type=raw,value=${{ matrix.php-version }}

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: internal/docker/embed
          target: ${{ env.IMAGE_TARGET }}
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            PHP_VARIANT=${{ env.IMAGE_PHP_VARIANT }}
            PHP_BUILD_MYSQL=1
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.php-version }}
          cache-to: type=gha,scope=${{ github.ref_name }}-${{ matrix.php-version
            }},mode=max
          push: ${{ github.event_name != 'pull_request' }}
