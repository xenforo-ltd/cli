name: CI

on:
  workflow_dispatch:

  push:
    branches:
      - "main"
    paths:
      - "**.go"
      - .golangci.yaml
      - .github/workflows/ci.yml

  pull_request:
    branches:
      - "main"
    paths:
      - "**.go"
      - .golangci.yaml
      - .github/workflows/ci.yml

concurrency:
  group: "${{ github.workflow }}@${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2604
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13

  test:
    name: ${{ matrix.name }}
    runs-on: blacksmith-4vcpu-ubuntu-2604
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - name: Test
            command: make test
          - name: Test (race)
            command: make test-race
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: stable

      - name: ${{ matrix.name }}
        env:
          COMMAND: ${{ matrix.command }}
        run: ${COMMAND}

  test-coverage:
    name: Test (coverage)
    runs-on: blacksmith-4vcpu-ubuntu-2604
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: stable

      - name: Test coverage
        run: make test-coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
