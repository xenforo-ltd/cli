version: 2

multi-ecosystem-groups:
  docker:
    schedule:
      interval: "monthly"

updates:
  - package-ecosystem: "docker"
    multi-ecosystem-group: "docker"
    directory: "/internal/docker/embed"
    patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: "docker-compose"
    multi-ecosystem-group: "docker"
    directory: "/internal/docker/embed"
    patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "monthly"

    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "monthly"

    groups:
      gomod:
        patterns:
          - "*"
