version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/internal/docker/embed"
    cooldown:
      default-days: 7
    schedule:
      interval: "monthly"

    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "monthly"

    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "monthly"

    groups:
      gomod:
        patterns:
          - "*"
